[input]
modality=video
v_fps=25

[model]
v_fps=25
model_path=korean_vsr_hybrid.pt
model_conf=benchmarks/LRS3/models/LRS3_V_WER19.1/model.json
spm_model=pipelines/tokens/unigram8000.model
; Decoding mode:
;   decode=ctc    -> CTC Greedy + SentencePiece detokenization (Paper Section II.2 / III.2)
;   decode=hybrid -> Joint CTC/Attention Beam Search (ctc_weight=0.3, decoder=0.7)
decode=ctc
ctc_weight=0.3
beam_size=10
sos_id=1
eos_id=2
